[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsebot"
version = "0.1.0"
description = "Algorithmic crypto backtesting and paper-trading engine with risk guardrails and SQLite ledger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
pulsebot = "pulsebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
